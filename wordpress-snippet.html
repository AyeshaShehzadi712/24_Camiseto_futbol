<!-- ===== 24 Camiseta Fútbol – Chatbot widget (paste into WPCode HTML snippet) ===== -->
<!-- IMPORTANT: set API_BASE below to your PUBLIC https URL, not localhost -->

<style>
  :root {
    /* --- brand palette (matches the store: navy + royal blue + trophy gold) --- */
    --ink:      #0e1430;   /* darkest header */
    --brand:    #1b2a6b;   /* navy */
    --brand-2:  #2f43c9;   /* royal blue (accent / user bubbles / send) */
    --brand-press: #2436a8;
    --gold:     #f5c518;   /* World Cup trophy accent */
    --surface:  #ffffff;
    --panel:    #f2f4fc;   /* bot bubble */
    --text:     #161a2b;
    --muted:    #6b7194;
    --border:   #e5e8f4;
    --radius:   18px;
    --shadow:   0 22px 55px -14px rgba(14, 20, 48, .45);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #e9ecf6; color: var(--text);
  }

  /* =====================================================================
     POSITION: bottom-RIGHT, stacked ~94px up so it sits directly ABOVE the
     WhatsApp button (which lives at the very bottom-right). If your WhatsApp
     button is a different size, tweak the launcher `bottom` value so there's
     a small gap between the two.
     ===================================================================== */

  /* --- launcher --- */
  .launcher {
    position: fixed; right: 24px; bottom: 94px;
    width: 62px; height: 62px; border-radius: 50%;
    border: none; cursor: pointer;
    background: linear-gradient(145deg, var(--brand) 0%, var(--brand-2) 100%);
    color: #fff; display: grid; place-items: center;
    box-shadow: var(--shadow), 0 0 0 3px rgba(245, 197, 24, .9);
    transition: transform .18s ease, box-shadow .18s ease;
    z-index: 2147483000;
  }
  .launcher:hover { transform: translateY(-2px) scale(1.04); }
  .launcher svg { width: 33px; height: 33px; display: block; }
  @media (prefers-reduced-motion: no-preference) {
    .launcher::after {
      content: ""; position: absolute; inset: -3px; border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(245,197,24,.5);
      animation: pulse 2.4s ease-out infinite;
    }
    @keyframes pulse { 0%{opacity:.7; transform:scale(1)} 70%{opacity:0; transform:scale(1.35)} 100%{opacity:0} }
  }

  /* --- panel --- */
  .panel {
    position: fixed; right: 24px; bottom: 94px;
    width: 384px; max-width: calc(100vw - 32px);
    height: 570px; max-height: calc(100vh - 120px);
    background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; overflow: hidden;
    transform-origin: bottom right; z-index: 2147483001;
  }
  .panel[hidden] { display: none; }
  @media (prefers-reduced-motion: no-preference) {
    .panel { animation: rise .24s cubic-bezier(.2,.8,.2,1); }
    @keyframes rise { from { opacity:0; transform: translateY(14px) scale(.97); } }
  }

  /* --- header --- */
  .head {
    position: relative;
    background: linear-gradient(135deg, var(--ink) 0%, var(--brand) 70%);
    color: #fff; padding: 16px 18px 14px;
  }
  .head::before { /* gold accent line */
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(90deg, var(--gold), #ffe27a, var(--gold));
  }
  .head-top { display: flex; align-items: center; gap: 11px; }
  .badge {
    width: 38px; height: 38px; border-radius: 11px; flex: none;
    background: rgba(255,255,255,.12); display: grid; place-items: center;
  }
  .badge svg { width: 23px; height: 23px; color: var(--gold); display: block; }
  .head h1 { font-size: 15.5px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .head p { margin: 1px 0 0; font-size: 12px; color: #ffffff; }
  .head p .dot { color: #38d39f; }
  .close { margin-left: auto; background: none; border: none; color: #b9c0e0; cursor: pointer; font-size: 22px; line-height: 1; padding: 4px; }
  .close:hover { color: #fff; }

  /* --- language toggle --- */
  .lang {
    margin-top: 13px; display: inline-flex;
    background: rgba(255,255,255,.10); border-radius: 999px; padding: 3px;
  }
  .lang button {
    border: none; background: none; cursor: pointer;
    color: #ffffff; font-size: 12.5px; font-weight: 600;
    padding: 6px 16px; border-radius: 999px;
    transition: background .15s, color .15s;
  }
  .lang button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }

  /* --- messages --- */
  .messages {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 10px; background: var(--surface);
  }
  .msg { max-width: 82%; padding: 10px 13px; font-size: 14px; line-height: 1.5; border-radius: 15px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.bot  { background: var(--panel); color: var(--text); align-self: flex-start; border-bottom-left-radius: 5px; }
  .msg.user { background: var(--brand-2); color: #fff; align-self: flex-end; border-bottom-right-radius: 5px; }

  .typing { display: inline-flex; gap: 4px; align-self: flex-start; background: var(--panel); padding: 13px 15px; border-radius: 15px; border-bottom-left-radius: 5px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #aab1d4; animation: blink 1.2s infinite both; }
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }

  /* --- composer --- */
  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: var(--surface); }
  .composer input {
    flex: 1; border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 13px; font-size: 14px; font-family: inherit; color: var(--text);
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .composer input:focus-visible { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(47,67,201,.16); }
  .send {
    border: none; cursor: pointer; background: var(--brand-2); color: #fff;
    width: 46px; border-radius: 12px; display: grid; place-items: center;
    transition: background .15s;
  }
  .send:hover { background: var(--brand-press); }
  .send:disabled { opacity: .5; cursor: default; }
  .send svg { width: 19px; height: 19px; }

  /* small footer credit line (optional) */
  .powered { text-align: center; font-size: 10.5px; color: var(--muted); padding: 0 0 8px; background: var(--surface); }
</style>

<!-- HEADPHONES launcher — balanced + box centered exactly at y=12 -->
  <button class="launcher" id="launcher" aria-label="Abrir asistente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 13a8 8 0 0 1 16 0"/>
      <rect x="3" y="12" width="4" height="7" rx="2"/>
      <rect x="17" y="12" width="4" height="7" rx="2"/>
    </svg>
  </button>

  <section class="panel" id="panel" hidden aria-label="Asistente virtual">
    <header class="head">
      <div class="head-top">
        <span class="badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13a8 8 0 0 1 16 0"/>
            <rect x="3" y="12" width="4" height="7" rx="2"/>
            <rect x="17" y="12" width="4" height="7" rx="2"/>
          </svg>
        </span>
        <div>
          <h1 data-i18n="title">Asistente 24 Camiseta</h1>
          <p><span class="dot">●</span> <span data-i18n="subtitle">En línea · pregúntame lo que quieras</span></p>
        </div>
        <button class="close" id="close" aria-label="Cerrar">&times;</button>
      </div>
      <div class="lang" role="group" aria-label="Idioma">
        <button id="lang-es" aria-pressed="true">Español</button>
        <button id="lang-en" aria-pressed="false">English</button>
      </div>
    </header>

    <div class="messages" id="messages" aria-live="polite"></div>

    <div class="composer">
      <input id="input" type="text" autocomplete="off" />
      <button class="send" id="send" aria-label="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="powered">24 Camiseta Fútbol</div>
  </section>

<script>
  // ---- CONFIG: point this at your running API ----
  const API_BASE = "http://localhost:8100";

  const i18n = {
    es: {
      title: "Asistente 24 Camiseta",
      subtitle: "En línea · pregúntame lo que quieras",
      placeholder: "Escribe tu pregunta…",
      greeting: "¡Hola! 👋 Soy el asistente de 24 Camiseta Fútbol. ¿En qué puedo ayudarte? Pregúntame sobre envíos, tallas, pagos o devoluciones.",
      error: "Lo siento, hubo un problema. Inténtalo de nuevo.",
    },
    en: {
      title: "24 Camiseta Assistant",
      subtitle: "Online · ask me anything",
      placeholder: "Type your question…",
      greeting: "Hi! 👋 I'm the 24 Camiseta Fútbol assistant. How can I help? Ask me about shipping, sizes, payments or returns.",
      error: "Sorry, something went wrong. Please try again.",
    },
  };

  let lang = "es";
  let history = [];
  let greeted = false;

  const el = (id) => document.getElementById(id);
  const panel = el("panel"), messages = el("messages"), input = el("input"), sendBtn = el("send");

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(n => n.textContent = i18n[lang][n.dataset.i18n]);
    input.placeholder = i18n[lang].placeholder;
    el("lang-es").setAttribute("aria-pressed", lang === "es");
    el("lang-en").setAttribute("aria-pressed", lang === "en");
  }

  function addMsg(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who; div.textContent = text;
    messages.appendChild(div); messages.scrollTop = messages.scrollHeight;
    return div;
  }
  function showTyping() {
    const t = document.createElement("div");
    t.className = "typing"; t.id = "typing";
    t.innerHTML = "<span></span><span></span><span></span>";
    messages.appendChild(t); messages.scrollTop = messages.scrollHeight;
  }
  function hideTyping() { const t = el("typing"); if (t) t.remove(); }

  function openPanel() {
    panel.hidden = false;
    if (!greeted) { addMsg(i18n[lang].greeting, "bot"); greeted = true; }
    input.focus();
  }

  async function send() {
    const q = input.value.trim();
    if (!q) return;
    addMsg(q, "user");
    history.push({ role: "user", content: q });
    input.value = ""; sendBtn.disabled = true; showTyping();
    try {
      const res = await fetch(API_BASE + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q, language: lang, history: history.slice(0, -1) }),
      });
      const data = await res.json();
      hideTyping();
      const answer = data.answer || i18n[lang].error;
      addMsg(answer, "bot");
      history.push({ role: "assistant", content: answer });
    } catch (e) {
      hideTyping(); addMsg(i18n[lang].error, "bot");
    } finally { sendBtn.disabled = false; input.focus(); }
  }

  el("launcher").addEventListener("click", openPanel);
  el("close").addEventListener("click", () => { panel.hidden = true; });
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  el("lang-es").addEventListener("click", () => { lang = "es"; applyLang(); });
  el("lang-en").addEventListener("click", () => { lang = "en"; applyLang(); });

  applyLang();
</script>
