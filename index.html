<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asistente · RAG Chatbot</title>
<style>
  :root {
    --ink: #14182b;
    --surface: #ffffff;
    --panel: #f4f5fa;
    --accent: #5b6cff;
    --accent-press: #4858e0;
    --text: #1b1f2a;
    --muted: #717689;
    --border: #e6e8f0;
    --radius: 16px;
    --shadow: 0 18px 50px -12px rgba(20, 24, 43, 0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #eef0f7;
    color: var(--text);
    min-height: 100vh;
  }

  /* --- launcher button --- */
  .launcher {
    position: fixed; right: 22px; bottom: 22px;
    width: 60px; height: 60px; border-radius: 50%;
    border: none; cursor: pointer;
    background: var(--ink); color: #fff;
    display: grid; place-items: center;
    box-shadow: var(--shadow);
    transition: transform .18s ease;
    z-index: 50;
  }
  .launcher:hover { transform: translateY(-2px) scale(1.03); }
  .launcher svg { width: 26px; height: 26px; }

  /* --- panel --- */
  .panel {
    position: fixed; right: 22px; bottom: 22px;
    width: 380px; max-width: calc(100vw - 32px);
    height: 560px; max-height: calc(100vh - 32px);
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    overflow: hidden;
    transform-origin: bottom right;
    z-index: 60;
  }
  .panel[hidden] { display: none; }
  @media (prefers-reduced-motion: no-preference) {
    .panel { animation: rise .22s cubic-bezier(.2,.8,.2,1); }
    @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.98); } }
  }

  /* --- header --- */
  .head {
    background: var(--ink); color: #fff;
    padding: 16px 18px 14px;
  }
  .head-top { display: flex; align-items: center; justify-content: space-between; }
  .head h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .head p { margin: 2px 0 0; font-size: 12.5px; color: #aab0c7; }
  .close { background: none; border: none; color: #aab0c7; cursor: pointer; font-size: 20px; line-height: 1; padding: 4px; }
  .close:hover { color: #fff; }

  /* --- language toggle --- */
  .lang {
    margin-top: 12px;
    display: inline-flex; background: rgba(255,255,255,.1);
    border-radius: 999px; padding: 3px;
  }
  .lang button {
    border: none; background: none; cursor: pointer;
    color: #c2c7da; font-size: 12.5px; font-weight: 600;
    padding: 5px 14px; border-radius: 999px;
    transition: background .15s, color .15s;
  }
  .lang button[aria-pressed="true"] { background: #fff; color: var(--ink); }

  /* --- messages --- */
  .messages {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--surface);
  }
  .msg { max-width: 82%; padding: 10px 13px; font-size: 14px; line-height: 1.45; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.bot { background: var(--panel); color: var(--text); align-self: flex-start; border-bottom-left-radius: 5px; }
  .msg.user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 5px; }

  /* typing dots */
  .typing { display: inline-flex; gap: 4px; align-self: flex-start; background: var(--panel); padding: 12px 14px; border-radius: 14px; border-bottom-left-radius: 5px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #b6bccb; animation: blink 1.2s infinite both; }
  .typing span:nth-child(2){ animation-delay:.2s } .typing span:nth-child(3){ animation-delay:.4s }
  @keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }

  /* --- input --- */
  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: var(--surface); }
  .composer input {
    flex: 1; border: 1px solid var(--border); border-radius: 11px;
    padding: 11px 13px; font-size: 14px; font-family: inherit; color: var(--text);
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .composer input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,108,255,.15); }
  .send {
    border: none; cursor: pointer; background: var(--accent); color: #fff;
    width: 44px; border-radius: 11px; display: grid; place-items: center;
    transition: background .15s;
  }
  .send:hover { background: var(--accent-press); }
  .send:disabled { opacity: .5; cursor: default; }
  .send svg { width: 19px; height: 19px; }
</style>
</head>
<body>

  <!-- The page behind is just a placeholder so you can see the widget float. -->

  <button class="launcher" id="launcher" aria-label="Abrir asistente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  </button>

  <section class="panel" id="panel" hidden aria-label="Asistente virtual">
    <header class="head">
      <div class="head-top">
        <div>
          <h1 data-i18n="title">Asistente virtual</h1>
          <p data-i18n="subtitle">Pregúntame lo que necesites</p>
        </div>
        <button class="close" id="close" aria-label="Cerrar">&times;</button>
      </div>
      <div class="lang" role="group" aria-label="Idioma">
        <button id="lang-es" aria-pressed="true">Español</button>
        <button id="lang-en" aria-pressed="false">English</button>
      </div>
    </header>

    <div class="messages" id="messages" aria-live="polite"></div>

    <div class="composer">
      <input id="input" type="text" autocomplete="off" />
      <button class="send" id="send" aria-label="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </section>

<script>
  // ---- CONFIG: point this at your running API ----
  const API_BASE = "https://frosty-snaking-lilac.ngrok-free.dev";

  const i18n = {
    es: {
      title: "Asistente virtual",
      subtitle: "Pregúntame lo que necesites",
      placeholder: "Escribe tu pregunta…",
      greeting: "¡Hola! ¿En qué puedo ayudarte hoy?",
      error: "Lo siento, hubo un problema. Inténtalo de nuevo.",
    },
    en: {
      title: "Virtual assistant",
      subtitle: "Ask me anything you need",
      placeholder: "Type your question…",
      greeting: "Hi! How can I help you today?",
      error: "Sorry, something went wrong. Please try again.",
    },
  };

  let lang = "es";
  let history = [];        // [{role, content}] sent to the API for follow-ups
  let greeted = false;

  const el = (id) => document.getElementById(id);
  const panel = el("panel"), messages = el("messages"), input = el("input"), sendBtn = el("send");

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(n => n.textContent = i18n[lang][n.dataset.i18n]);
    input.placeholder = i18n[lang].placeholder;
    el("lang-es").setAttribute("aria-pressed", lang === "es");
    el("lang-en").setAttribute("aria-pressed", lang === "en");
  }

  function addMsg(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function showTyping() {
    const t = document.createElement("div");
    t.className = "typing"; t.id = "typing";
    t.innerHTML = "<span></span><span></span><span></span>";
    messages.appendChild(t);
    messages.scrollTop = messages.scrollHeight;
  }
  function hideTyping() { const t = el("typing"); if (t) t.remove(); }

  function openPanel() {
    panel.hidden = false;
    if (!greeted) { addMsg(i18n[lang].greeting, "bot"); greeted = true; }
    input.focus();
  }

  async function send() {
    const q = input.value.trim();
    if (!q) return;
    addMsg(q, "user");
    history.push({ role: "user", content: q });
    input.value = "";
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(API_BASE + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q, language: lang, history: history.slice(0, -1) }),
      });
      const data = await res.json();
      hideTyping();
      const answer = data.answer || i18n[lang].error;
      addMsg(answer, "bot");
      history.push({ role: "assistant", content: answer });
    } catch (e) {
      hideTyping();
      addMsg(i18n[lang].error, "bot");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  el("launcher").addEventListener("click", openPanel);
  el("close").addEventListener("click", () => { panel.hidden = true; });
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  el("lang-es").addEventListener("click", () => { lang = "es"; applyLang(); });
  el("lang-en").addEventListener("click", () => { lang = "en"; applyLang(); });

  applyLang();
</script>
</body>
</html>
